#
# إعداد نجينكس لصنعة على CloudPanel — قالب كامل، مش بلوكات تتلزق.
#
# ده اللي مرفوع فعلًا على sanaa.cloud. الملف فيه علامتين بيتغيّروا:
# `DOMAIN` و`SITE_USER` — و`deploy/vhost.sh` بيحطهم ويطبع الناتج.
#
# بيروح فين: CloudPanel → Sites → الموقع → Vhost، بدل اللي موجود كله.
# اللوحة هي اللي بتعمل `nginx -t` وترفض الحفظ لو فيه غلطة، فهي الطريق
# الآمن. علامات `{{...}}` اللي جوّه اللوحة بتحلّها هي بنفسها.
#
# القالب الجاهز للموقع الثابت في CloudPanel مافيهوش `location /` خالص،
# وبيحط `expires max` على أي حاجة بتنتهي بـ.js. يعني لو سيبناه:
#   ١) أي مسار جوه صنعة (`/orders`) ياخد ٤٠٤ أول Refresh
#   ٢) الـsw.js يتكاش للأبد، والمستخدم يفضل على نسخة قديمة من النظام
# والاتنين دول بيخلوا نظام سليم يبان مكسور.
#

#
# صفحة النظام نفسها ممنوع تتكاش، وبتتحدد من هنا.
#
# ليه `map` ومش `add_header` جوه `location = /index.html`: في نجينكس، أي
# location بيحط `add_header` بنفسه **بيرمي** كل الهيدرز اللي جاية من
# فوقه — يعني كل صفحات النظام كانت هتطلع من غير X-Frame-Options ولا
# nosniff ولا Permissions-Policy. بالطريقة دي الهيدر بيتحدد مرة واحدة
# على مستوى الـserver جوّه `location /` اللي مالوش add_header خاص،
# فالهيدرز الأمنية بتفضل واصلة. والقيمة الفاضية نجينكس بيتجاهلها.
#
# و`/orders` و`/health` بيوصلوا لـ`/index.html` جوًّا بـtry_files، فالـ
# $uri بيبقى `/index.html` وقت تقييم الـmap — وده المطلوب.
#
map $uri $sanaa_cache_control {
  default      "";
  /index.html  "no-store, no-cache, must-revalidate";
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.DOMAIN;
  return 301 https://DOMAIN$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name DOMAIN www1.DOMAIN;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  add_header Cache-Control $sanaa_cache_control always;

  # الكاميرا مسموحة لأن مركز المسح بيقرأ QR منها
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  #
  # الملفات التلاتة دي ممنوع تتكاش، ودي أهم حاجة في الملف.
  #
  # سيرفس ووركر متكاش معناه إن المستخدم يفضل شايف نسخة قديمة من النظام
  # بعد أي تحديث ومش بيعرف — وده أسوأ حاجة تحصل في نظام بيمشي عليه
  # فلوس مصنع. والقالب الجاهز بيحط `expires max` على أي حاجة بتنتهي
  # بـ.js، وده بيشمل sw.js. المطابقة بـ`location =` بتكسب على أي regex
  # في نجينكس، فالبلوكات دي بتعدّي على القالب.
  #
  location = /sw.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /registerSW.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  # ونجينكس مايعرفش الامتداد ده، وكان بيطلعه octet-stream فالمتصفح
  # مابيقراش بيانات التطبيق منه
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  # أسماء ملفات البناء فيها هاش، فأي تعديل بيغيّر الاسم — الكاش الطويل
  # آمن، و`=404` عشان ملف ناقص يبان ٤٠٤ مش يرجّع الـindex مكانه
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
    try_files $uri =404;
  }

  #
  # صنعة تطبيق صفحة واحدة: المسارات جواه (`/orders`، `/health`) مش
  # ملفات على الديسك. القالب الجاهز مافيهوش `location /` خالص، فأي
  # مسار غير `/` كان بياخد ٤٠٤ — يعني أول Refresh جوه أي شاشة الصفحة
  # تضيع. السطر ده بيرجّع الطلب للتطبيق وهو يقرر يعرض إيه.
  #
  location / {
    try_files $uri $uri/ /index.html;
  }
}
