#
# صنعة على CloudPanel — البلوكات اللي تتحط جوه `server { … }`
#
# CloudPanel بيولّد الـvhost بنفسه (Sites → الموقع → Vhost)، وفيه سطور
# للشهادة والـlogs مالهاش لازمة تتغيّر. اللي تحت ده هو الجزء المختص
# بالتطبيق: بتحطه جوه بلوك `server` اللي شغّال على ٤٤٣، وتشيل أي
# `location /` قديم موجود.
#
# ليه محتاج تعديل من الأصل: صنعة تطبيق صفحة واحدة، والمسارات جواه
# (`/orders`، `/health`) مش ملفات على الديسك. نجينكس الافتراضي بيرد
# ٤٠٤ على أي مسار غير `/`، فلو حد عمل Refresh وهو جوه الشاشة بيلاقي
# الصفحة ضاعت. سطر `try_files` هو اللي بيحل ده.
#

root /home/SITE_USER/htdocs/DOMAIN;
index index.html;

# أي مسار مش ملف موجود بيرجع للتطبيق نفسه، وهو اللي بيقرر يعرض إيه
location / {
  try_files $uri $uri/ /index.html;
}

# ملفات البناء أسماءها فيها هاش، فأي تغيير بيغيّر الاسم.
# يعني تتكاش سنة بأمان، وده اللي بيخلي الفتح التاني فوري.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  access_log off;
  try_files $uri =404;
}

# الصور والخطوط: كاش شهر، ومش لازم تدخل الـlog
location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
  access_log off;
}

#
# الملفات دي **ممنوع** تتكاش، وده أهم بلوك في الملف.
#
# صنعة PWA، وسيرفس ووركر متكاش معناه إن المستخدم يفضل شايف نسخة
# قديمة من النظام بعد أي تحديث، ومش بيعرف إنه بيبص على حاجة قديمة —
# ودي أسوأ حالة تحصل في نظام بيمشي عليه فلوس مصنع.
#
location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
  expires off;
  add_header Cache-Control "no-store, no-cache, must-revalidate";
}

location = /index.html {
  expires off;
  add_header Cache-Control "no-store, no-cache, must-revalidate";
}

# البيانات كلها في المتصفح في النسخة الحالية، فالهيدرز دي بتقلّل
# مساحة أي سكربت غريب يلعب في الـstorage
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# الكاميرا مسموحة لأن مركز المسح بيقرأ QR منها

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
