#
# بلوك HTTPS واحد لكل صاب دومينات صنعة — بشهادة wildcard.
#
# بيتنسخ على السيرفر في `/etc/nginx/sanaa-subdomains.d/000-catchall.conf`،
# و`deploy/wildcard.sh` هو اللي بيحطّه.
#
# الاسم بيبدأ بـ`000` عشان يتقرا قبل أي بلوك لـslug معيّن. ده مش بيغيّر
# النتيجة — نجينكس بيختار البلوك بمطابقة `server_name` مش بالترتيب،
# والاسم الصريح (`alnoor.sanaa.cloud`) بيغلب الـwildcard دايمًا — بس
# بيخلّي الترتيب في الفولدر مقروء.
#
# ولما الـwildcard يشتغل، بلوكات الـslug الفردية بتبقى زيادة. سيبها لحد
# ما شهاداتها تنتهي لوحدها بدل ما نمسح حاجة شغّالة؛ التفاصيل في
# `docs/subdomains.md`.
#
# ليه ده أحسن من شهادة لكل slug:
#
#   ١) مصنع جديد بيشتغل على عنوانه **من غير أي خطوة على السيرفر**. قبل
#      كده كان لازم حد يشغّل `subdomain.sh` لكل مصنع، ولو نسي المصنع
#      بيلاقي خطأ شهادة — يعني الصفحة مابتفتحش خالص، ومش بيبان سببها.
#   ٢) حد Let's Encrypt ٥٠ شهادة للدومين في الأسبوع. شهادة لكل مصنع
#      معناها سقف ٥٠ مصنع جديد في الأسبوع. الـwildcard شهادة واحدة.
#
# والمقابل: الـwildcard لازم تحقق DNS-01، يعني توكن DNS على السيرفر.
#

server {
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;

  server_name *.sanaa.cloud;

  ssl_certificate     /etc/letsencrypt/live/sanaa.cloud-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sanaa.cloud-wildcard/privkey.pem;

  root /home/sanaa/htdocs/sanaa.cloud;

  access_log /home/sanaa/logs/nginx/subdomains-access.log main;
  error_log /home/sanaa/logs/nginx/subdomains-error.log;

  include /etc/nginx/global_settings;
  include /etc/nginx/sanaa-app.inc;
}
