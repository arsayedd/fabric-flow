#
# صاب دومينات المصانع — `<slug>.sanaa.cloud`
#
# بيتنسخ على السيرفر في `/etc/nginx/sites-enabled/sanaa-wildcard.conf`.
#
# البلوك ده على بورت ٨٠ بس، وشغلته حاجتين:
#
#   ١) يرد على تحقق Let's Encrypt لأي صاب دومين. من غيره الشهادة
#      مابتطلعش خالص، لأن الطلب بيروح للموقع الافتراضي في CloudPanel
#      وهو بيقطع الاتصال.
#   ٢) يوَدّي الباقي على HTTPS.
#
# أما HTTPS نفسه، كل صاب دومين له بلوك في `sanaa-subdomains.d/` بشهادته.
#
# ليه شهادة لكل صاب دومين ومش شهادة wildcard واحدة: شهادة `*.sanaa.cloud`
# لازم تحقق DNS-01، والـDNS عند Hostinger ومحتاج توكن API + إضافة
# لـcertbot. والتحقق بـHTTP-01 شغّال دلوقتي من غير أي توكن، وبيتجدد
# لوحده. التفاصيل والمقارنة في `docs/subdomains.md`.
#

server {
  listen 80;
  listen [::]:80;
  server_name *.sanaa.cloud;

  access_log /home/sanaa/logs/nginx/wildcard-access.log main;
  error_log /home/sanaa/logs/nginx/wildcard-error.log;

  # لازم يفضل على HTTP من غير تحويل، وإلا التحقق بيفشل
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

include /etc/nginx/sanaa-subdomains.d/*.conf;
